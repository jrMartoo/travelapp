<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafiriPesa - Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #f8f9fa;
        }

        /* Simple Header for the Gallery Page */
        .gallery-header {
            background-color: #2c3e50;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .gallery-header h1 {
            color: white;
            font-size: 1.5rem;
        }

        .back-btn {
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn:hover {
            background-color: #219a52;
            transform: translateY(-2px);
        }

        /* The Image Grid */
        .gallery-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 5%;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            height: 300px; /* Fixed height for uniformity */
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08); /* Slight zoom on hover */
        }
    </style>
</head>
<body>

    <!-- Gallery Navigation -->
    <header class="gallery-header">
        <h1>SafiriPesa Gallery</h1>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </header>

    <!-- The Images -->
    <div class="gallery-container">
        <div class="gallery-grid">
            <!-- Add all your images here -->
            <div class="gallery-item"><img src="images/img1.jpg" alt="Gallery Image"></div>
            <div class="gallery-item"><img src="images/img2.jpg" alt="Gallery Image"></div>
            <div class="gallery-item"><img src="images/img3.jpg" alt="Gallery Image"></div>
            <div class="gallery-item"><img src="images/img4.jpg" alt="Gallery Image"></div>
            <div class="gallery-item"><img src="images/img5.jpg" alt="Gallery Image"></div>
            <div class="gallery-item"><img src="images/img6.jpg" alt="Gallery Image"></div>
            <div class="gallery-item"><img src="images/img7.jpg" alt="Gallery Image"></div>
            <div class="gallery-item"><img src="images/img9.jpg" alt="Gallery Image"></div>
            
            <!-- Add more images if you have them, just copy the line above and change the number -->
        </div>
    </div>

</body>
</html>
